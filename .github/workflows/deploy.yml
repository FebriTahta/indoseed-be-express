name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  # ============================================================
  # BUILD BACKEND
  # ============================================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Backend
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci --no-audit --no-fund

      - name: Diagnose Prisma Installation
        run: |
          echo "========================================"
          echo "PRISMA PACKAGE"
          echo "========================================"

          npm ls prisma @prisma/client @prisma/engines || true

          echo ""
          echo "========================================"
          echo "PRISMA ENGINES"
          echo "========================================"

          find node_modules/@prisma/engines \
            -maxdepth 5 \
            -type f \
            -ls || true

          echo ""
          echo "========================================"
          echo "SCHEMA ENGINE"
          echo "========================================"

          find node_modules/@prisma \
            -type f \
            -name 'schema-engine*' \
            -ls || true

          echo ""
          echo "========================================"
          echo "QUERY ENGINE"
          echo "========================================"

          find node_modules/@prisma \
            -type f \
            -name 'query-engine*' \
            -ls || true

      - name: Generate Prisma Client
        run: |
          npx prisma generate

      - name: Verify Prisma
        run: |
          echo "========================================"
          echo "PRISMA VERSION"
          echo "========================================"

          npx prisma -v

          echo ""
          echo "========================================"
          echo "PRISMA DIRECTORY"
          echo "========================================"

          ls -lah node_modules/@prisma || true

          echo ""
          echo "========================================"
          echo "PRISMA ENGINES DIRECTORY"
          echo "========================================"

          ls -lah node_modules/@prisma/engines || true

          echo ""
          echo "========================================"
          echo "SCHEMA ENGINE / QUERY ENGINE"
          echo "========================================"

          find node_modules/@prisma \
            -type f \
            \( -name 'schema-engine*' -o -name 'query-engine*' \) \
            -ls || true

      - name: Build Backend
        run: |
          npm run build

      - name: Verify Backend Build
        run: |
          test -f dist/server.js
          test -d prisma

          echo "=== Backend build ==="
          du -sh dist
          du -sh prisma
          du -sh node_modules

      - name: Verify Prisma config
        run: |
          test -f prisma.config.ts
          test -f prisma/schema.prisma

          echo "Prisma config:"
          ls -lh prisma.config.ts

          echo "Prisma schema:"
          ls -lh prisma/schema.prisma

      - name: Package Backend
        run: |
          tar -czf backend.tar.gz \
            dist \
            prisma \
            prisma.config.ts \
            node_modules \
            package.json \
            package-lock.json

          echo "=== Backend artifact ==="
          ls -lh backend.tar.gz

      - name: Verify backend package
        run: |
          echo "========================================"
          echo "BACKEND ARTIFACT CONTENT"
          echo "========================================"

          echo ""
          echo "=== prisma.config.ts ==="
          tar -tzf backend.tar.gz | grep \
            'prisma.config.ts' || true

          echo ""
          echo "=== Prisma schema ==="
          tar -tzf backend.tar.gz | grep \
            'prisma/schema.prisma' || true

          echo ""
          echo "=== Prisma engines ==="
          tar -tzf backend.tar.gz | grep -E \
            'schema-engine|query-engine' || true

          echo ""
          echo "=== Generated Prisma Client ==="
          tar -tzf backend.tar.gz | grep \
            'node_modules/.prisma/client' | head -20 || true

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: backend.tar.gz
          retention-days: 1


  # ============================================================
  # BUILD FRONTEND
  # ============================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          repository: FebriTahta/indoseed-fe-next
          token: ${{ secrets.FE_REPO_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci --no-audit --no-fund

      - name: Build Frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          npm run build

      - name: Verify Next.js Standalone
        run: |
          test -f .next/standalone/server.js

          echo "=== Standalone ==="
          du -sh .next/standalone

          echo "=== Static ==="
          du -sh .next/static

          if [ -d public ]; then
            echo "=== Public ==="
            du -sh public
          fi

      - name: Prepare Frontend Package
        run: |
          mkdir -p frontend-package

          cp -R .next/standalone frontend-package/standalone
          cp -R .next/static frontend-package/static

          if [ -d public ]; then
            cp -R public frontend-package/public
          fi

      - name: Package Frontend
        run: |
          tar -czf frontend.tar.gz \
            -C frontend-package \
            standalone \
            static \
            $(if [ -d frontend-package/public ]; then echo public; fi)

          echo "=== Frontend artifact ==="
          ls -lh frontend.tar.gz

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend.tar.gz
          retention-days: 1


  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    needs:
      - build-backend
      - build-frontend

    steps:
      # ----------------------------------------------------------
      # Download artifacts
      # ----------------------------------------------------------
      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend
          path: ./backend

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend
          path: ./frontend

      - name: Check Artifacts
        run: |
          echo "=== Backend ==="
          ls -lah ./backend

          echo "=== Frontend ==="
          ls -lah ./frontend

          echo "=== Sizes ==="
          du -sh ./backend/backend.tar.gz
          du -sh ./frontend/frontend.tar.gz


      # ----------------------------------------------------------
      # Setup SSH
      # ----------------------------------------------------------
      - name: Setup SSH
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

          echo "SSH configuration completed."


      # ----------------------------------------------------------
      # Test SSH connection
      # ----------------------------------------------------------
      - name: Test SSH Connection
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            root@${{ secrets.VPS_HOST }} \
            "echo 'SSH connection OK'"


      # ----------------------------------------------------------
      # Prepare VPS deployment directory
      # ----------------------------------------------------------
      - name: Prepare Deployment Directory
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            root@${{ secrets.VPS_HOST }} \
            "
              mkdir -p /tmp/indoseed-deploy/backend
              mkdir -p /tmp/indoseed-deploy/frontend

              rm -f /tmp/indoseed-deploy/backend/backend.tar.gz
              rm -f /tmp/indoseed-deploy/frontend/frontend.tar.gz

              echo 'Deployment directory ready'
            "


      # ----------------------------------------------------------
      # Upload Backend
      # ----------------------------------------------------------
      - name: Upload Backend
        run: |
          echo "Uploading backend..."

          scp \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ./backend/backend.tar.gz \
            root@${{ secrets.VPS_HOST }}:/tmp/indoseed-deploy/backend/backend.tar.gz

          echo "Backend upload completed."


      # ----------------------------------------------------------
      # Verify Backend Upload
      # ----------------------------------------------------------
      - name: Verify Backend Upload
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            root@${{ secrets.VPS_HOST }} \
            "
              ls -lh /tmp/indoseed-deploy/backend/backend.tar.gz
            "


      # ----------------------------------------------------------
      # Upload Frontend
      # ----------------------------------------------------------
      - name: Upload Frontend
        run: |
          echo "Uploading frontend..."

          scp \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ./frontend/frontend.tar.gz \
            root@${{ secrets.VPS_HOST }}:/tmp/indoseed-deploy/frontend/frontend.tar.gz

          echo "Frontend upload completed."


      # ----------------------------------------------------------
      # Verify Frontend Upload
      # ----------------------------------------------------------
      - name: Verify Frontend Upload
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            root@${{ secrets.VPS_HOST }} \
            "
              ls -lh /tmp/indoseed-deploy/frontend/frontend.tar.gz
            "


      # ==========================================================
      # DEPLOY ON VPS
      # ==========================================================
      - name: Deploy Application
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            root@${{ secrets.VPS_HOST }} << 'EOF'

          set -e

          echo "========================================"
          echo "START DEPLOYMENT"
          echo "========================================"

          BACKEND_DIR="/var/www/indoseed-be-express"
          FRONTEND_DIR="/var/www/indoseed-fe-next"

          DEPLOY_DIR="/tmp/indoseed-deploy"

          BACKEND_ARCHIVE="$DEPLOY_DIR/backend/backend.tar.gz"
          FRONTEND_ARCHIVE="$DEPLOY_DIR/frontend/frontend.tar.gz"


          # ======================================================
          # CHECK ARCHIVES
          # ======================================================

          echo ""
          echo "=== CHECK ARCHIVES ==="

          test -f "$BACKEND_ARCHIVE"
          test -f "$FRONTEND_ARCHIVE"

          ls -lh "$BACKEND_ARCHIVE"
          ls -lh "$FRONTEND_ARCHIVE"


          # ======================================================
          # CHECK PM2
          # ======================================================

          echo ""
          echo "=== CURRENT PM2 ==="

          pm2 list || true


          # ======================================================
          # STOP APPLICATIONS
          # ======================================================

          echo ""
          echo "=== STOP APPLICATIONS ==="

          pm2 stop indoseed-api || true
          pm2 stop indoseed-fe || true


          # ======================================================
          # BACKEND
          # ======================================================

          echo ""
          echo "========================================"
          echo "DEPLOY BACKEND"
          echo "========================================"

          rm -rf "${BACKEND_DIR}.new"

          mkdir -p "${BACKEND_DIR}.new"

          echo "Extract backend..."

          tar -xzf "$BACKEND_ARCHIVE" \
            -C "${BACKEND_DIR}.new"

          echo "Backend extracted."

          # Preserve .env
          if [ -f "$BACKEND_DIR/.env" ]; then
            cp "$BACKEND_DIR/.env" "${BACKEND_DIR}.new/.env"
            echo ".env preserved."
          fi

          # Backup current backend
          rm -rf "${BACKEND_DIR}.old"

          if [ -d "$BACKEND_DIR" ]; then
            mv "$BACKEND_DIR" "${BACKEND_DIR}.old"
          fi

          mv "${BACKEND_DIR}.new" "$BACKEND_DIR"

          echo "Backend activated."


          # ======================================================
          # FRONTEND
          # ======================================================

          echo ""
          echo "========================================"
          echo "DEPLOY FRONTEND"
          echo "========================================"

          rm -rf "${FRONTEND_DIR}.new"

          mkdir -p "${FRONTEND_DIR}.new"

          echo "Extract frontend..."

          tar -xzf "$FRONTEND_ARCHIVE" \
            -C "${FRONTEND_DIR}.new"

          echo "Frontend extracted."

          # Preserve .env
          if [ -f "$FRONTEND_DIR/.env" ]; then
            cp "$FRONTEND_DIR/.env" "${FRONTEND_DIR}.new/.env"
            echo ".env preserved."
          fi

          # Backup current frontend
          rm -rf "${FRONTEND_DIR}.old"

          if [ -d "$FRONTEND_DIR" ]; then
            mv "$FRONTEND_DIR" "${FRONTEND_DIR}.old"
          fi

          mv "${FRONTEND_DIR}.new" "$FRONTEND_DIR"

          echo "Frontend activated."


          # ======================================================
          # BACKEND PRISMA
          # ======================================================

          echo ""
          echo "========================================"
          echo "PRISMA DATABASE RESET"
          echo "========================================"

          cd "$BACKEND_DIR"

          npx prisma migrate reset --force

          echo "Prisma reset completed."


          # ======================================================
          # SEED
          # ======================================================

          echo ""
          echo "========================================"
          echo "PRISMA SEED"
          echo "========================================"

          npx prisma db seed

          echo "Prisma seed completed."


          # ======================================================
          # START BACKEND
          # ======================================================

          echo ""
          echo "========================================"
          echo "START BACKEND"
          echo "========================================"

          if pm2 describe indoseed-api > /dev/null 2>&1; then

            pm2 restart indoseed-api

          else

            pm2 start dist/server.js \
              --name indoseed-api

          fi


          # ======================================================
          # START FRONTEND
          # ======================================================

          echo ""
          echo "========================================"
          echo "START FRONTEND"
          echo "========================================"

          cd "$FRONTEND_DIR"

          if pm2 describe indoseed-fe > /dev/null 2>&1; then

            pm2 restart indoseed-fe

          else

            pm2 start standalone/server.js \
              --name indoseed-fe

          fi


          # ======================================================
          # SAVE PM2
          # ======================================================

          echo ""
          echo "========================================"
          echo "SAVE PM2"
          echo "========================================"

          pm2 save


          # ======================================================
          # WAIT
          # ======================================================

          echo ""
          echo "Waiting for applications..."

          sleep 10


          # ======================================================
          # PM2 STATUS
          # ======================================================

          echo ""
          echo "========================================"
          echo "PM2 STATUS"
          echo "========================================"

          pm2 list


          # ======================================================
          # CLEANUP OLD RELEASES
          # ======================================================

          echo ""
          echo "========================================"
          echo "CLEANUP"
          echo "========================================"

          rm -rf "${BACKEND_DIR}.old"
          rm -rf "${FRONTEND_DIR}.old"

          rm -rf "$DEPLOY_DIR"

          echo "Cleanup completed."


          echo ""
          echo "========================================"
          echo "DEPLOYMENT SUCCESS"
          echo "========================================"

          EOF