name: Deploy Development to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 30m

          script: |
            set -e

            export NODE_OPTIONS="--max-old-space-size=768"

            echo "========================================"
            echo "       DEVELOPMENT DEPLOYMENT"
            echo "========================================"

            echo "=== Stop Backend ==="
            pm2 stop indoseed-api || true

            echo "=== Stop Frontend ==="
            pm2 stop indoseed-fe || true

            echo "=== Backend: Update Source ==="
            cd /var/www/indoseed-be-express

            git fetch origin
            git reset --hard origin/main
            git clean -fd

            echo "=== Backend: Remove Old Dependencies ==="
            rm -rf node_modules

            echo "=== Memory Before npm ci ==="
            sync
            echo 3 | sudo tee /proc/sys/vm/drop_caches > /dev/null
            free -h

            echo "=== Backend: Install Dependencies ==="
            npm ci --prefer-offline --no-audit --no-fund

            echo "=== Backend: Generate Prisma Client ==="
            npx prisma generate

            echo "=== Backend: Reset Development Database ==="
            npx prisma migrate reset --force

            echo "=== Backend: Seed Database ==="
            npx prisma db seed

            echo "=== Backend: Build ==="
            npm run build

            echo "=== Backend: Start ==="
            if pm2 describe indoseed-api > /dev/null 2>&1; then
              pm2 restart indoseed-api
            else
              pm2 start dist/server.js --name indoseed-api
            fi

            pm2 save

            echo "=== Frontend: Update Source ==="
            cd /var/www/indoseed-fe-next

            pm2 stop indoseed-api || true

            git fetch origin
            git reset --hard origin/main
            git clean -fd

            echo "=== Frontend: Remove Old Dependencies ==="
            rm -rf node_modules

            echo "=== Memory Before Frontend Install ==="
            sync
            echo 3 | sudo tee /proc/sys/vm/drop_caches > /dev/null
            free -h

            echo "=== Frontend: Install Dependencies ==="
            npm ci --prefer-offline --no-audit --no-fund

            echo "=== Frontend: Build ==="
            npm run build

            echo "=== Frontend: Check Port 3000 ==="
            if ss -ltnp | grep -q ':3000 '; then
              fuser -k 3000/tcp || true
              sleep 2
            fi

            echo "=== Frontend: Start ==="
            if pm2 describe indoseed-fe > /dev/null 2>&1; then
              pm2 restart indoseed-fe
            else
              pm2 start npm --name indoseed-fe -- start
            fi

            pm2 save

            echo "=== Final Status ==="
            pm2 list
            free -h

            echo "========================================"
            echo "       DEPLOYMENT SELESAI"
            echo "========================================"