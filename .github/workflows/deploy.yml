name: Deploy Indoseed Development

on:
  push:
    branches:
      - main

concurrency:
  group: indoseed-development
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ============================================================
  # BUILD BACKEND
  # ============================================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout Backend
        uses: actions/checkout@v4
        with:
          path: backend


      # --------------------------------------------------------
      # NODE
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json


      # --------------------------------------------------------
      # INSTALL
      # --------------------------------------------------------

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund


      # --------------------------------------------------------
      # PRISMA
      # --------------------------------------------------------

      - name: Generate Prisma Client
        working-directory: backend
        run: |
          npx prisma generate


      # --------------------------------------------------------
      # BUILD
      # --------------------------------------------------------

      - name: Build Backend
        working-directory: backend
        run: |
          npm run build


      # --------------------------------------------------------
      # PREPARE ARTIFACT
      # --------------------------------------------------------

      - name: Prepare Backend Artifact
        working-directory: backend
        run: |

          set -e

          rm -rf deploy

          mkdir -p deploy


          echo "=== COPY DIST ==="

          cp -r dist deploy/


          echo "=== COPY PRISMA ==="

          cp -r prisma deploy/


          echo "=== COPY NODE MODULES ==="

          cp -r node_modules deploy/


          echo "=== COPY PACKAGE FILES ==="

          cp package.json deploy/
          cp package-lock.json deploy/


          echo "=== CREATE ARCHIVE ==="

          tar \
            -czf ../backend.tar.gz \
            -C deploy .


          echo "=== BACKEND ARTIFACT SIZE ==="

          du -h ../backend.tar.gz


      # --------------------------------------------------------
      # UPLOAD ARTIFACT
      # --------------------------------------------------------

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: backend.tar.gz
          retention-days: 1


  # ============================================================
  # BUILD FRONTEND
  # ============================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT PRIVATE FRONTEND
      # --------------------------------------------------------

      - name: Checkout Private Frontend
        uses: actions/checkout@v4
        with:
          repository: FebriTahta/indoseed-fe-next
          ref: main
          token: ${{ secrets.FE_REPO_PAT }}
          path: frontend


      # --------------------------------------------------------
      # NODE
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      # --------------------------------------------------------
      # INSTALL
      # --------------------------------------------------------

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund


      # --------------------------------------------------------
      # BUILD
      # --------------------------------------------------------

      - name: Build Frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          npm run build


      # --------------------------------------------------------
      # PREPARE FRONTEND STANDALONE
      # --------------------------------------------------------

      - name: Prepare Frontend Artifact
        working-directory: frontend
        run: |

          set -e

          rm -rf deploy

          mkdir -p deploy


          echo "=== CHECK NEXT STANDALONE ==="

          if [ ! -d ".next/standalone" ]; then
            echo ""
            echo "ERROR: .next/standalone tidak ditemukan."
            echo ""
            echo "Pastikan next.config.js / next.config.ts memiliki:"
            echo ""
            echo "output: 'standalone'"
            echo ""
            exit 1
          fi


          echo "=== COPY STANDALONE ==="

          cp -r .next/standalone deploy/standalone


          echo "=== COPY STATIC ==="

          mkdir -p deploy/standalone/.next

          cp -r .next/static deploy/standalone/.next/static


          echo "=== COPY PUBLIC ==="

          if [ -d "public" ]; then
            cp -r public deploy/standalone/public
          fi


          echo "=== CREATE ARCHIVE ==="

          tar \
            -czf ../frontend.tar.gz \
            -C deploy .


          echo "=== FRONTEND ARTIFACT SIZE ==="

          du -h ../frontend.tar.gz


      # --------------------------------------------------------
      # UPLOAD ARTIFACT
      # --------------------------------------------------------

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend.tar.gz
          retention-days: 1


  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:
    name: Deploy Backend + Frontend
    runs-on: ubuntu-latest

    needs:
      - build-backend
      - build-frontend

    steps:

      # ========================================================
      # DOWNLOAD ARTIFACT
      # ========================================================

      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend
          path: artifacts/backend


      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend
          path: artifacts/frontend


      # ========================================================
      # SHOW ARTIFACT SIZE
      # ========================================================

      - name: Show Artifact Sizes
        run: |

          echo "=============================================="
          echo "ARTIFACT SIZE"
          echo "=============================================="

          du -h artifacts/backend/backend.tar.gz
          du -h artifacts/frontend/frontend.tar.gz

          echo ""

          ls -lh artifacts/backend/backend.tar.gz
          ls -lh artifacts/frontend/frontend.tar.gz


      # ========================================================
      # UPLOAD BACKEND
      # ========================================================

      - name: Upload Backend Artifact
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22

          source: "artifacts/backend/backend.tar.gz"

          target: "/tmp/indoseed-deploy/backend"

          overwrite: true


      # ========================================================
      # UPLOAD FRONTEND
      # ========================================================

      - name: Upload Frontend Artifact
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22

          source: "artifacts/frontend/frontend.tar.gz"

          target: "/tmp/indoseed-deploy/frontend"

          overwrite: true


      # ========================================================
      # DEPLOY TO VPS
      # ========================================================

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.VPS_HOST }}

          username: ${{ secrets.VPS_USER }}

          key: ${{ secrets.VPS_SSH_KEY }}

          port: 22

          command_timeout: 30m

          script: |

            set -e


            # ==================================================
            # VARIABLES
            # ==================================================

            BACKEND_PATH="/var/www/indoseed-be-express"

            FRONTEND_PATH="/var/www/indoseed-fe-next"

            DEPLOY_PATH="/tmp/indoseed-deploy"

            BACKEND_ARCHIVE="${DEPLOY_PATH}/backend/backend.tar.gz"

            FRONTEND_ARCHIVE="${DEPLOY_PATH}/frontend/frontend.tar.gz"


            # ==================================================
            # NODE MEMORY LIMIT
            # ==================================================

            export NODE_OPTIONS="--max-old-space-size=768"


            echo ""
            echo "================================================"
            echo "       INDOSEED DEVELOPMENT DEPLOYMENT"
            echo "================================================"
            echo ""


            # ==================================================
            # MEMORY
            # ==================================================

            echo "=== MEMORY BEFORE DEPLOYMENT ==="

            free -h

            echo ""


            # ==================================================
            # CHECK ARCHIVES
            # ==================================================

            echo "=== CHECK DEPLOYMENT ARCHIVES ==="

            if [ ! -f "${BACKEND_ARCHIVE}" ]; then

              echo "Backend archive tidak ditemukan."

              exit 1

            fi


            if [ ! -f "${FRONTEND_ARCHIVE}" ]; then

              echo "Frontend archive tidak ditemukan."

              exit 1

            fi


            ls -lh "${BACKEND_ARCHIVE}"

            ls -lh "${FRONTEND_ARCHIVE}"

            echo ""


            # ==================================================
            # CREATE DEPLOY DIRECTORY
            # ==================================================

            mkdir -p "${DEPLOY_PATH}"


            # ==================================================
            # STOP APPLICATIONS
            # ==================================================

            echo "=== STOP BACKEND ==="

            pm2 stop indoseed-api || true


            echo "=== STOP FRONTEND ==="

            pm2 stop indoseed-fe || true


            # ==================================================
            # PREPARE NEW DIRECTORIES
            # ==================================================

            echo "=== PREPARE BACKEND ==="

            rm -rf "${BACKEND_PATH}.new"

            mkdir -p "${BACKEND_PATH}.new"


            echo "=== PREPARE FRONTEND ==="

            rm -rf "${FRONTEND_PATH}.new"

            mkdir -p "${FRONTEND_PATH}.new"


            # ==================================================
            # EXTRACT BACKEND
            # ==================================================

            echo "=== EXTRACT BACKEND ==="

            tar \
              -xzf "${BACKEND_ARCHIVE}" \
              -C "${BACKEND_PATH}.new"


            # ==================================================
            # EXTRACT FRONTEND
            # ==================================================

            echo "=== EXTRACT FRONTEND ==="

            tar \
              -xzf "${FRONTEND_ARCHIVE}" \
              -C "${FRONTEND_PATH}.new"


            # ==================================================
            # PRESERVE BACKEND ENV
            # ==================================================

            echo "=== PRESERVE BACKEND ENV ==="

            if [ -f "${BACKEND_PATH}/.env" ]; then

              cp \
                "${BACKEND_PATH}/.env" \
                "${BACKEND_PATH}.new/.env"

            fi


            # ==================================================
            # PRESERVE FRONTEND ENV
            # ==================================================

            echo "=== PRESERVE FRONTEND ENV ==="

            if [ -f "${FRONTEND_PATH}/.env" ]; then

              cp \
                "${FRONTEND_PATH}/.env" \
                "${FRONTEND_PATH}.new/.env"

            fi


            # ==================================================
            # REMOVE OLD BACKUPS
            # ==================================================

            echo "=== REMOVE OLD BACKUPS ==="

            rm -rf "${BACKEND_PATH}.old"

            rm -rf "${FRONTEND_PATH}.old"


            # ==================================================
            # BACKUP CURRENT VERSION
            # ==================================================

            echo "=== BACKUP CURRENT BACKEND ==="

            if [ -d "${BACKEND_PATH}" ]; then

              mv \
                "${BACKEND_PATH}" \
                "${BACKEND_PATH}.old"

            fi


            echo "=== BACKUP CURRENT FRONTEND ==="

            if [ -d "${FRONTEND_PATH}" ]; then

              mv \
                "${FRONTEND_PATH}" \
                "${FRONTEND_PATH}.old"

            fi


            # ==================================================
            # ACTIVATE BACKEND
            # ==================================================

            echo "=== ACTIVATE BACKEND ==="

            mv \
              "${BACKEND_PATH}.new" \
              "${BACKEND_PATH}"


            # ==================================================
            # ACTIVATE FRONTEND
            # ==================================================

            echo "=== ACTIVATE FRONTEND ==="

            mv \
              "${FRONTEND_PATH}.new" \
              "${FRONTEND_PATH}"


            # ==================================================
            # PRISMA DATABASE
            # ==================================================

            echo ""
            echo "================================================"
            echo "          RESET DEVELOPMENT DATABASE"
            echo "================================================"
            echo ""


            cd "${BACKEND_PATH}"


            echo "=== PRISMA MIGRATE RESET ==="

            NODE_OPTIONS="--max-old-space-size=512" \
              npx prisma migrate reset --force


            echo ""

            echo "=== PRISMA SEED ==="

            NODE_OPTIONS="--max-old-space-size=512" \
              npx prisma db seed


            # ==================================================
            # REMOVE OLD VERSION
            # ==================================================

            echo ""

            echo "=== REMOVE OLD BACKEND ==="

            rm -rf "${BACKEND_PATH}.old"


            echo "=== REMOVE OLD FRONTEND ==="

            rm -rf "${FRONTEND_PATH}.old"


            # ==================================================
            # CHECK PORT
            # ==================================================

            echo ""

            echo "=== CHECK PORT 3000 ==="


            if ss -ltnp | grep -q ':3000 '; then

              echo "Port 3000 masih digunakan."

              fuser -k 3000/tcp || true

              sleep 2

            fi


            # ==================================================
            # START BACKEND
            # ==================================================

            echo ""

            echo "=== START BACKEND ==="


            cd "${BACKEND_PATH}"


            if pm2 describe indoseed-api > /dev/null 2>&1; then

              pm2 restart indoseed-api --update-env

            else

              pm2 start dist/server.js \
                --name indoseed-api \
                --node-args="--max-old-space-size=768"

            fi


            # ==================================================
            # START FRONTEND
            # ==================================================

            echo ""

            echo "=== START FRONTEND ==="


            cd "${FRONTEND_PATH}/standalone"


            if pm2 describe indoseed-fe > /dev/null 2>&1; then

              pm2 restart indoseed-fe --update-env

            else

              pm2 start server.js \
                --name indoseed-fe \
                --node-args="--max-old-space-size=768"

            fi


            # ==================================================
            # SAVE PM2
            # ==================================================

            echo ""

            echo "=== SAVE PM2 ==="

            pm2 save


            # ==================================================
            # CLEANUP
            # ==================================================

            echo ""

            echo "=== CLEANUP ==="

            rm -rf "${DEPLOY_PATH}"


            # ==================================================
            # FINAL STATUS
            # ==================================================

            echo ""

            echo "================================================"
            echo "              FINAL STATUS"
            echo "================================================"
            echo ""


            pm2 list


            echo ""

            echo "=== MEMORY AFTER DEPLOYMENT ==="

            free -h


            echo ""

            echo "=== SWAP ==="

            swapon --show


            echo ""

            echo "================================================"
            echo "       DEPLOYMENT BERHASIL"
            echo "================================================"