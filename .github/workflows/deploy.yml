name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e

            echo "=== Masuk ke folder project ==="
            cd /var/www/indoseed-be-express

            echo "=== Konfigurasi Memori & Swap ==="
            export NODE_OPTIONS="--max-old-space-size=1024"
            if [ $(swapon --show | wc -l) -le 1 ]; then
              echo "Membuat swap file 2GB untuk mencegah OOM..."
              (sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048) 2>/dev/null || true
              sudo chmod 600 /swapfile 2>/dev/null || true
              sudo mkswap /swapfile 2>/dev/null || true
              sudo swapon /swapfile 2>/dev/null || true
            fi

            echo "=== Bebaskan RAM sementara ==="
            pm2 stop indoseed-api || true

            echo "=== Reset source ke origin/main ==="
            git fetch origin
            git reset --hard origin/main
            git clean -fd

            echo "=== Install dependency (Ringan) ==="
            rm -rf node_modules/.*-* node_modules/.staging 2>/dev/null || true
            npm install --omit=dev --prefer-offline --no-audit --no-fund || {
              echo "Membersihkan node_modules yang corrupt dan mengulang install..."
              rm -rf node_modules
              npm install --omit=dev --prefer-offline --no-audit --no-fund
            }

            echo "=== Generate Prisma ==="
            npx prisma generate

            echo "=== Update database DEV ==="
            npx prisma migrate reset --force
            
            echo "=== Jalankan Seeder ==="
            npx prisma db seed

            echo "=== Build Typescript ==="
            npm run build

            echo "=== Reload PM2 ==="
            pm2 restart indoseed-api || pm2 start indoseed-api || pm2 reload indoseed-api

            echo "=== Deploy selesai ==="
