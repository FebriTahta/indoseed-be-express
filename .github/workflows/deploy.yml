name: Deploy Development to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: development-deployment
  cancel-in-progress: true

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: indoseed-be-express
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        working-directory: indoseed-be-express
        run: npx prisma generate

      - name: Build Backend
        working-directory: indoseed-be-express
        run: npm run build

      - name: Create Backend Artifact
        run: |
          mkdir -p deploy/backend

          cp -r indoseed-be-express/dist deploy/backend/
          cp -r indoseed-be-express/prisma deploy/backend/
          cp -r indoseed-be-express/node_modules deploy/backend/
          cp indoseed-be-express/package.json deploy/backend/
          cp indoseed-be-express/package-lock.json deploy/backend/

          tar -czf backend.tar.gz -C deploy/backend .

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: backend.tar.gz
          retention-days: 1

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: indoseed-fe-next
        run: npm ci --no-audit --no-fund

      - name: Build Frontend
        working-directory: indoseed-fe-next
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Create Frontend Artifact
        run: |
          mkdir -p deploy/frontend

          cp -r indoseed-fe-next/.next deploy/frontend/
          cp -r indoseed-fe-next/public deploy/frontend/ 2>/dev/null || true
          cp -r indoseed-fe-next/node_modules deploy/frontend/
          cp indoseed-fe-next/package.json deploy/frontend/
          cp indoseed-fe-next/package-lock.json deploy/frontend/

          tar -czf frontend.tar.gz -C deploy/frontend .

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-frontend

    steps:
      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend

      - name: Upload Backend Artifact
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: backend.tar.gz
          target: /tmp/indoseed-deploy

      - name: Upload Frontend Artifact
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: frontend.tar.gz
          target: /tmp/indoseed-deploy

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 30m

          script: |
            set -e

            BACKEND_PATH="/var/www/indoseed-be-express"
            FRONTEND_PATH="/var/www/indoseed-fe-next"
            DEPLOY_PATH="/tmp/indoseed-deploy"

            echo "========================================"
            echo "       DEVELOPMENT DEPLOYMENT"
            echo "========================================"

            echo "=== Memory Before Deployment ==="
            free -h

            echo "=== Stop Backend ==="
            pm2 stop indoseed-api || true

            echo "=== Stop Frontend ==="
            pm2 stop indoseed-fe || true

            echo "=== Prepare Backend ==="
            rm -rf "${BACKEND_PATH}.new"
            mkdir -p "${BACKEND_PATH}.new"

            tar -xzf "${DEPLOY_PATH}/backend.tar.gz" \
              -C "${BACKEND_PATH}.new"

            if [ -f "${BACKEND_PATH}/.env" ]; then
              cp "${BACKEND_PATH}/.env" "${BACKEND_PATH}.new/.env"
            fi

            echo "=== Replace Backend ==="
            rm -rf "${BACKEND_PATH}.old"
            mv "${BACKEND_PATH}" "${BACKEND_PATH}.old"
            mv "${BACKEND_PATH}.new" "${BACKEND_PATH}"

            echo "=== Reset Development Database ==="
            cd "${BACKEND_PATH}"

            npx prisma migrate reset --force

            echo "=== Seed Development Database ==="
            npx prisma db seed

            echo "=== Remove Old Backend ==="
            rm -rf "${BACKEND_PATH}.old"

            echo "=== Start Backend ==="
            if pm2 describe indoseed-api > /dev/null 2>&1; then
              pm2 restart indoseed-api --update-env
            else
              pm2 start dist/server.js --name indoseed-api
            fi

            echo "=== Prepare Frontend ==="
            rm -rf "${FRONTEND_PATH}.new"
            mkdir -p "${FRONTEND_PATH}.new"

            tar -xzf "${DEPLOY_PATH}/frontend.tar.gz" \
              -C "${FRONTEND_PATH}.new"

            if [ -f "${FRONTEND_PATH}/.env" ]; then
              cp "${FRONTEND_PATH}/.env" "${FRONTEND_PATH}.new/.env"
            fi

            if [ -f "${FRONTEND_PATH}/.env.local" ]; then
              cp "${FRONTEND_PATH}/.env.local" "${FRONTEND_PATH}.new/.env.local"
            fi

            if [ -f "${FRONTEND_PATH}/.env.production" ]; then
              cp "${FRONTEND_PATH}/.env.production" "${FRONTEND_PATH}.new/.env.production"
            fi

            echo "=== Check Port 3000 ==="
            pm2 stop indoseed-fe || true

            if ss -ltnp | grep -q ':3000 '; then
              fuser -k 3000/tcp || true
              sleep 2
            fi

            echo "=== Replace Frontend ==="
            rm -rf "${FRONTEND_PATH}.old"
            mv "${FRONTEND_PATH}" "${FRONTEND_PATH}.old"
            mv "${FRONTEND_PATH}.new" "${FRONTEND_PATH}"

            echo "=== Remove Old Frontend ==="
            rm -rf "${FRONTEND_PATH}.old"

            echo "=== Start Frontend ==="
            cd "${FRONTEND_PATH}"

            if pm2 describe indoseed-fe > /dev/null 2>&1; then
              pm2 restart indoseed-fe --update-env
            else
              pm2 start npm --name indoseed-fe -- start
            fi

            echo "=== Save PM2 ==="
            pm2 save

            echo "=== Cleanup ==="
            rm -rf "${DEPLOY_PATH}"

            echo "=== Final Status ==="
            pm2 list
            free -h

            echo "========================================"
            echo "       DEPLOYMENT SELESAI"
            echo "========================================"