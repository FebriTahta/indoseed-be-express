name: Deploy Indoseed Development

on:
  push:
    branches:
      - main

concurrency:
  group: indoseed-development
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ============================================================
  # BUILD BACKEND
  # ============================================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Backend
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        working-directory: backend
        run: |
          npx prisma generate

      - name: Build Backend
        working-directory: backend
        run: |
          npm run build

      - name: Prepare Backend Artifact
        working-directory: backend
        run: |
          rm -rf deploy
          mkdir -p deploy

          cp -r dist deploy/
          cp -r prisma deploy/
          cp -r node_modules deploy/

          cp package.json deploy/
          cp package-lock.json deploy/

          tar -czf ../backend.tar.gz -C deploy .

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: backend.tar.gz
          retention-days: 1


  # ============================================================
  # BUILD FRONTEND
  # ============================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Private Frontend
        uses: actions/checkout@v4
        with:
          repository: FebriTahta/indoseed-fe-next
          ref: main
          token: ${{ secrets.FE_REPO_PAT }}
          path: frontend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund

      - name: Build Frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          npm run build

      - name: Prepare Frontend Artifact
        working-directory: frontend
        run: |
          rm -rf deploy
          mkdir -p deploy

          cp -r .next deploy/
          cp -r public deploy/
          cp -r node_modules deploy/

          cp package.json deploy/
          cp package-lock.json deploy/

          tar -czf ../frontend.tar.gz -C deploy .

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend.tar.gz
          retention-days: 1


  # ============================================================
  # DEPLOY TO VPS
  # ============================================================
  deploy:
    name: Deploy Backend + Frontend
    runs-on: ubuntu-latest

    needs:
      - build-backend
      - build-frontend

    steps:

      # --------------------------------------------------------
      # DOWNLOAD ARTIFACT
      # --------------------------------------------------------

      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend
          path: artifacts/backend

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend
          path: artifacts/frontend


      # --------------------------------------------------------
      # UPLOAD BACKEND
      # --------------------------------------------------------

      - name: Upload Backend Artifact
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "artifacts/backend/backend.tar.gz"
          target: "/tmp/indoseed-deploy/backend"


      # --------------------------------------------------------
      # UPLOAD FRONTEND
      # --------------------------------------------------------

      - name: Upload Frontend Artifact
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "artifacts/frontend/frontend.tar.gz"
          target: "/tmp/indoseed-deploy/frontend"


      # ========================================================
      # DEPLOY
      # ========================================================

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 30m

          script: |

            set -e

            BACKEND_PATH="/var/www/indoseed-be-express"
            FRONTEND_PATH="/var/www/indoseed-fe-next"

            DEPLOY_PATH="/tmp/indoseed-deploy"

            BACKEND_ARCHIVE="${DEPLOY_PATH}/backend/backend.tar.gz"
            FRONTEND_ARCHIVE="${DEPLOY_PATH}/frontend/frontend.tar.gz"


            echo ""
            echo "================================================"
            echo "       INDOSEED DEVELOPMENT DEPLOYMENT"
            echo "================================================"
            echo ""

            echo "=== MEMORY BEFORE DEPLOYMENT ==="
            free -h

            echo ""


            # ==================================================
            # STOP APPLICATION
            # ==================================================

            echo "=== STOP BACKEND ==="

            pm2 stop indoseed-api || true


            echo "=== STOP FRONTEND ==="

            pm2 stop indoseed-fe || true


            # ==================================================
            # PREPARE BACKEND
            # ==================================================

            echo "=== PREPARE BACKEND ==="

            rm -rf "${BACKEND_PATH}.new"

            mkdir -p "${BACKEND_PATH}.new"


            # ==================================================
            # PREPARE FRONTEND
            # ==================================================

            echo "=== PREPARE FRONTEND ==="

            rm -rf "${FRONTEND_PATH}.new"

            mkdir -p "${FRONTEND_PATH}.new"


            # ==================================================
            # EXTRACT BACKEND
            # ==================================================

            echo "=== EXTRACT BACKEND ==="

            tar -xzf "${BACKEND_ARCHIVE}" \
              -C "${BACKEND_PATH}.new"


            # ==================================================
            # EXTRACT FRONTEND
            # ==================================================

            echo "=== EXTRACT FRONTEND ==="

            tar -xzf "${FRONTEND_ARCHIVE}" \
              -C "${FRONTEND_PATH}.new"


            # ==================================================
            # PRESERVE BACKEND .ENV
            # ==================================================

            echo "=== PRESERVE BACKEND ENV ==="

            if [ -f "${BACKEND_PATH}/.env" ]; then

              cp \
                "${BACKEND_PATH}/.env" \
                "${BACKEND_PATH}.new/.env"

            fi


            # ==================================================
            # PRESERVE FRONTEND .ENV
            # ==================================================

            echo "=== PRESERVE FRONTEND ENV ==="

            if [ -f "${FRONTEND_PATH}/.env" ]; then

              cp \
                "${FRONTEND_PATH}/.env" \
                "${FRONTEND_PATH}.new/.env"

            fi


            # ==================================================
            # REMOVE OLD BACKUP
            # ==================================================

            echo "=== REMOVE OLD BACKUP ==="

            rm -rf "${BACKEND_PATH}.old"
            rm -rf "${FRONTEND_PATH}.old"


            # ==================================================
            # BACKUP CURRENT VERSION
            # ==================================================

            echo "=== BACKUP CURRENT BACKEND ==="

            if [ -d "${BACKEND_PATH}" ]; then

              mv \
                "${BACKEND_PATH}" \
                "${BACKEND_PATH}.old"

            fi


            echo "=== BACKUP CURRENT FRONTEND ==="

            if [ -d "${FRONTEND_PATH}" ]; then

              mv \
                "${FRONTEND_PATH}" \
                "${FRONTEND_PATH}.old"

            fi


            # ==================================================
            # ACTIVATE NEW VERSION
            # ==================================================

            echo "=== ACTIVATE BACKEND ==="

            mv \
              "${BACKEND_PATH}.new" \
              "${BACKEND_PATH}"


            echo "=== ACTIVATE FRONTEND ==="

            mv \
              "${FRONTEND_PATH}.new" \
              "${FRONTEND_PATH}"


            # ==================================================
            # DATABASE RESET
            # ==================================================

            echo ""
            echo "================================================"
            echo "          RESET DEVELOPMENT DATABASE"
            echo "================================================"
            echo ""

            cd "${BACKEND_PATH}"


            echo "=== PRISMA MIGRATE RESET ==="

            npx prisma migrate reset --force


            echo ""
            echo "=== PRISMA SEED ==="

            npx prisma db seed


            # ==================================================
            # REMOVE OLD VERSION
            # ==================================================

            echo ""
            echo "=== REMOVE OLD BACKEND ==="

            rm -rf "${BACKEND_PATH}.old"


            echo "=== REMOVE OLD FRONTEND ==="

            rm -rf "${FRONTEND_PATH}.old"


            # ==================================================
            # CHECK FRONTEND PORT
            # ==================================================

            echo ""
            echo "=== CHECK PORT 3000 ==="

            if ss -ltnp | grep -q ':3000 '; then

              echo "Port 3000 masih digunakan."

              fuser -k 3000/tcp || true

              sleep 2

            fi


            # ==================================================
            # START BACKEND
            # ==================================================

            echo ""
            echo "=== START BACKEND ==="

            cd "${BACKEND_PATH}"


            if pm2 describe indoseed-api > /dev/null 2>&1; then

              pm2 restart indoseed-api --update-env

            else

              pm2 start dist/server.js \
                --name indoseed-api

            fi


            # ==================================================
            # START FRONTEND
            # ==================================================

            echo ""
            echo "=== START FRONTEND ==="

            cd "${FRONTEND_PATH}"


            if pm2 describe indoseed-fe > /dev/null 2>&1; then

              pm2 restart indoseed-fe --update-env

            else

              pm2 start npm \
                --name indoseed-fe \
                -- start

            fi


            # ==================================================
            # SAVE PM2
            # ==================================================

            echo ""
            echo "=== SAVE PM2 ==="

            pm2 save


            # ==================================================
            # CLEANUP
            # ==================================================

            echo ""
            echo "=== CLEANUP ==="

            rm -rf "${DEPLOY_PATH}"


            # ==================================================
            # FINAL STATUS
            # ==================================================

            echo ""
            echo "================================================"
            echo "              FINAL STATUS"
            echo "================================================"
            echo ""

            pm2 list

            echo ""

            echo "=== MEMORY AFTER DEPLOYMENT ==="

            free -h

            echo ""

            echo "================================================"
            echo "       DEPLOYMENT BERHASIL"
            echo "================================================"